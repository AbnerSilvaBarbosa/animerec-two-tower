services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: anime
      POSTGRES_DB: anime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://anime:anime@db:5432/anime
      ANIMEREC_ROOT: /app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data            # archive.zip -> data/raw (extraído pela etapa 1)
      - ./artifacts:/app/artifacts  # modelos treinados persistem entre restarts

volumes:
  pgdata:
