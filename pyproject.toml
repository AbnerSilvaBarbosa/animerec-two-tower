[project]
name = "animerec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "scipy>=1.18.1",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animerec"]
